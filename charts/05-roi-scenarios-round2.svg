  </style>
<text x="70" y="58" class="title">Revised ROI scenarios</text>
<text x="70" y="88" class="sub muted">Updated after Malt-based delivery benchmarking: €102k implementation + €34k annual operating estimate</text>
<line x1="110" y1="447.1" x2="1090" y2="447.1" stroke="#9CA3AB" stroke-width="1"/>
<rect x="222" y="447.1" width="58" height="18.6" rx="6" fill="#E6924A"/><text x="251" y="471.1" text-anchor="middle" class="label">-34%</text>
<rect x="288" y="429.0" width="58" height="18.1" rx="6" fill="#5CAF5C"/><text x="317" y="419.0" text-anchor="middle" class="label">33%</text><text x="270" y="555" text-anchor="middle" class="label">Conservative</text>
<rect x="552" y="423.5" width="58" height="23.6" rx="6" fill="#E6924A"/><text x="581" y="413.5" text-anchor="middle" class="label">43%</text>
<rect x="618" y="345.6" width="58" height="101.5" rx="6" fill="#5CAF5C"/><text x="647" y="335.6" text-anchor="middle" class="label">185%</text><text x="600" y="555" text-anchor="middle" class="label">Base</text>
<rect x="882" y="328.1" width="58" height="119.0" rx="6" fill="#E6924A"/><text x="911" y="318.1" text-anchor="middle" class="label">217%</text>
<rect x="948" y="154.8" width="58" height="292.3" rx="6" fill="#5CAF5C"/><text x="977" y="144.8" text-anchor="middle" class="label">533%</text><text x="930" y="555" text-anchor="middle" class="label">Upside</text>
