<rect x="950" y="112" width="18" height="18" rx="4" fill="#5CAF5C"/><text x="977" y="126" class="axis">36 months</text>
<text x="70" y="595" class="small">Scenario analysis, not a forecast. The conservative Year-1 case remains below break-even.</text>
