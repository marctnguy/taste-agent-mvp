<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="100%" height="100%" fill="#14181D"/>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #F2F2EF; }
    .muted { fill: #9CA3AB; }
    .title { font-size: 34px; font-weight: 650; letter-spacing: -1.2px; }
    .sub { font-size: 16px; }
    .axis { font-size: 14px; fill: #9CA3AB; }
    .label { font-size: 15px; }
    .small { font-size: 12px; fill: #9CA3AB; }
  </style>
<text x="70" y="58" class="title">Letterboxd reported membership growth</text>
<text x="70" y="88" class="sub muted">From 1.8M members in 2020 to 30.7M by Q2 2026</text>
<polyline points="90.0,501.5 296.0,477.8 502.0,417.1 708.0,251.5 914.0,221.7 1120.0,204.2" fill="none" stroke="#F2B06F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90" y1="520.0" x2="1120" y2="520.0" stroke="#303640" stroke-width="1"/>
<text x="45" y="525.0" class="axis">0M</text>
<line x1="90" y1="417.1" x2="1120" y2="417.1" stroke="#303640" stroke-width="1"/>
<text x="45" y="422.1" class="axis">10M</text>
<line x1="90" y1="314.3" x2="1120" y2="314.3" stroke="#303640" stroke-width="1"/>
<text x="45" y="319.3" class="axis">20M</text>
<line x1="90" y1="211.4" x2="1120" y2="211.4" stroke="#303640" stroke-width="1"/>
<text x="45" y="216.4" class="axis">30M</text>
<circle cx="90.0" cy="501.5" r="7" fill="#F2B06F"/>
<text x="90.0" y="485.5" text-anchor="middle" class="label">1.8M</text>
<text x="90.0" y="558" text-anchor="middle" class="axis">2020</text>
<circle cx="296.0" cy="477.8" r="7" fill="#F2B06F"/>
<text x="296.0" y="461.8" text-anchor="middle" class="label">4.1M</text>
<text x="296.0" y="558" text-anchor="middle" class="axis">2021</text>
<circle cx="502.0" cy="417.1" r="7" fill="#F2B06F"/>
<text x="502.0" y="401.1" text-anchor="middle" class="label">10M</text>
<text x="502.0" y="558" text-anchor="middle" class="axis">2023</text>
<circle cx="708.0" cy="251.5" r="7" fill="#F2B06F"/>
<text x="708.0" y="235.5" text-anchor="middle" class="label">26.1M</text>
<text x="708.0" y="558" text-anchor="middle" class="axis">Q4 2025</text>
<circle cx="914.0" cy="221.7" r="7" fill="#F2B06F"/>
